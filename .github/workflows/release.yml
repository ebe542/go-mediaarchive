name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]]; then
            printf 'Release tag must be annotated: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            printf 'Release tag is not based on main: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          if ! grep -Eq "^## \\[$release_version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            printf 'CHANGELOG.md has no dated section for %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run quality gate
        run: bash ./scripts/check_milestone.sh --race

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          bash ./scripts/build_release.sh
          --version "$RELEASE_TAG"
          --output-directory dist

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
