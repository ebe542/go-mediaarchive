name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          go run ./cmd/projectctl release validate
          --version "$RELEASE_TAG"

      - name: Run quality gate
        run: go run ./cmd/projectctl check --race

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          go run ./cmd/projectctl release build
          --version "$RELEASE_TAG"
          --output-directory dist

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
